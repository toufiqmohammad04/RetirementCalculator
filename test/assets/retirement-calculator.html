<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Savings Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 0 auto;
            padding: 24px;
            background: #f7f9fb;
        }
        h1 {
            margin-bottom: 16px;
        }
        form {
            background: #fff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .radio-group label {
            font-weight: 400;
        }
        #result-message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #e6fffa;
            color: #03543f;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>
    <h1>Retirement Savings Calculator</h1>
    <form id="retirement-form">
        <div class="field">
            <label for="current-age">Current Age</label>
            <input id="current-age" name="currentAge" type="number" min="18" max="100" value="40" required>
        </div>
        <div class="field">
            <label for="retirement-age">Retirement Age</label>
            <input id="retirement-age" name="retirementAge" type="number" min="50" max="100" value="68" required>
        </div>
        <div class="field">
            <label for="current-annual-income">Current annual income</label>
            <input id="current-annual-income" name="currentAnnualIncome" type="number" min="0" value="100000" required>
        </div>
        <div class="field">
            <label for="spouse-annual-income">Spouse’s annual income</label>
            <input id="spouse-annual-income" name="spouseAnnualIncome" type="number" min="0" value="75000">
        </div>
        <div class="field">
            <label for="current-retirement-savings">Current retirement savings</label>
            <input id="current-retirement-savings" name="currentRetirementSavings" type="number" min="0" value="500000" required>
        </div>
        <div class="field">
            <label for="current-retirement-contribution">Current retirement contribution (%)</label>
            <input id="current-retirement-contribution" name="currentRetirementContribution" type="number" min="0" max="100" step="0.01" value="10" required>
        </div>
        <div class="field">
            <label for="annual-retirement-contribution-increase">Annual retirement contribution increase (%)</label>
            <input id="annual-retirement-contribution-increase" name="annualRetirementContributionIncrease" type="number" min="0" max="100" step="0.01" value="0.25" required>
        </div>
        <div class="field">
            <label>Social Security Income</label>
            <div class="radio-group">
                <label><input id="social-security-yes" name="socialSecurityIncome" type="radio" value="yes" checked> Yes</label>
                <label><input id="social-security-no" name="socialSecurityIncome" type="radio" value="no"> No</label>
            </div>
        </div>
        <div class="field" id="social-security-override-wrapper">
            <label for="social-security-override">Social Security Override ($)</label>
            <input id="social-security-override" name="socialSecurityOverride" type="number" min="0" value="4000">
        </div>
        <div class="field">
            <label for="relationship-status">Relationship status</label>
            <select id="relationship-status" name="relationshipStatus" required>
                <option value="single">Single</option>
                <option value="married" selected>Married</option>
                <option value="partnered">Partnered</option>
            </select>
        </div>
        <div class="field">
            <label for="additional-income">Additional/other income</label>
            <input id="additional-income" name="additionalIncome" type="number" min="0" value="500">
        </div>
        <div class="field">
            <label for="retirement-years">Number of years retirement needs to last</label>
            <input id="retirement-years" name="retirementYears" type="number" min="1" max="50" value="20" required>
        </div>
        <div class="field">
            <label>Post-retirement income increase with inflation</label>
            <div class="radio-group">
                <label><input id="post-retirement-inflation-yes" name="postRetirementInflation" type="radio" value="yes" checked> Yes</label>
                <label><input id="post-retirement-inflation-no" name="postRetirementInflation" type="radio" value="no"> No</label>
            </div>
        </div>
        <div class="field">
            <label for="percent-final-income">Percent of final annual income desired (%)</label>
            <input id="percent-final-income" name="percentFinalIncome" type="number" min="0" max="100" step="0.01" value="75" required>
        </div>
        <div class="field">
            <label for="pre-retirement-return">Pre-retirement investment return (%)</label>
            <input id="pre-retirement-return" name="preRetirementReturn" type="number" min="0" max="100" step="0.01" value="8" required>
        </div>
        <div class="field">
            <label for="post-retirement-return">Post-retirement investment return (%)</label>
            <input id="post-retirement-return" name="postRetirementReturn" type="number" min="0" max="100" step="0.01" value="5" required>
        </div>
        <button id="retirement-submit" type="submit">Calculate retirement savings</button>
    </form>
    <div id="result-message" role="status"></div>
    <script>
        const form = document.getElementById('retirement-form');
        const yesRadio = document.getElementById('social-security-yes');
        const noRadio = document.getElementById('social-security-no');
        const overrideWrapper = document.getElementById('social-security-override-wrapper');
        const resultMessage = document.getElementById('result-message');

        function updateSocialSecurityFields() {
            overrideWrapper.style.display = yesRadio.checked ? 'block' : 'none';
        }

        yesRadio.addEventListener('change', updateSocialSecurityFields);
        noRadio.addEventListener('change', updateSocialSecurityFields);
        updateSocialSecurityFields();

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const age = document.getElementById('current-age').value;
            const retirementAge = document.getElementById('retirement-age').value;
            const relationship = document.getElementById('relationship-status').value;
            const socialSecurity = yesRadio.checked ? 'enabled' : 'disabled';

            resultMessage.textContent = `Retirement plan saved. Age ${age}, retirement age ${retirementAge}, relationship status ${relationship}, Social Security ${socialSecurity}.`;
            resultMessage.style.display = 'block';
        });
    </script>
</body>
</html>
